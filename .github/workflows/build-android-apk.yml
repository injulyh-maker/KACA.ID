name: KACA.ID - Android Tablet APK (beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tablet/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (without deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 35 and Build Tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Package Windows UI HTML and CSS for Android
        run: python3 android-tablet/tools/prepare_windows_ui.py
      - name: Verify WebView UI assets
        run: |
          node --check android-tablet/ui/android-ui.js
          test -s android-tablet/app/src/main/assets/www/index.html
          test -s android-tablet/app/src/main/assets/www/style.css
      - name: Check Android responsive layout and settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('android-tablet/app/src/main/assets/www/android-ui.js').read_text()
          css=Path('android-tablet/app/src/main/assets/www/android-ui.css').read_text()
          for required in ('function generalSettings()', 'function devices()', 'function setup()', 'function saveCaptureOptions()', "document.body.classList.add('android-tablet-ui')"):
              assert required in js, 'Missing Android setting: '+required
          for required in ('dashboard-mode .studio-dashboard', 'max-height:620px', 'android-drawer-open', 'overflow:visible!important', 'overflow-y:auto!important', 'android-settings-tabs', 'android-settings-pane[hidden]'):
              assert required in css, 'Missing responsive override: '+required
          java=Path('android-tablet/app/src/main/java/id/kaca/tablet/TabletActivity.java').read_text()
          printer=Path('android-tablet/app/src/main/java/id/kaca/tablet/AndroidPhotoPrinter.java').read_text()
          for required in ('enhanceGeneralAndroid()', 'function androidPrinters()', 'function scanAndroidHardware()', 'native.printLastPhoto', 'androidPlayAudio', 'android-settings-tab'):
              assert required in js, 'Missing native Android UI: '+required
          for required in ('scanDevices()', 'printerServices()', 'printLastPhoto(String media,String fitting)', 'USB_CLASS_STILL_IMAGE', 'USB_CLASS_VIDEO'):
              assert required in java, 'Missing Android hardware bridge: '+required
          for required in ('PrintManager', 'PrintDocumentAdapter', 'PdfDocument', '"KACA_4R"', '"2R"', '"2R_STRIP"'):
              assert required in printer, 'Missing Print Framework support: '+required
          print('Responsive settings, USB discovery, 4R/2R PDF print, audio controls verified')
          PY
      - name: Build APK for device testing
        working-directory: android-tablet
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK (TEST ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: KACA-ID-Android-Tablet-0.9.92-beta-APK
          path: android-tablet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
