name: KACA.ID Cloud Gallery Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud_control/**'
      - '.github/workflows/cloud-gallery-tests.yml'
permissions:
  contents: read
jobs:
  test-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloud test dependencies
        run: |
          python -m pip install -r cloud_control/requirements.txt httpx
      - name: Validate Cloud Python syntax
        run: python -m py_compile cloud_control/server.py cloud_control/web_gallery.py
      - name: Test 1-day licenses, private upload, gallery and public links
        run: python -m unittest discover -s cloud_control/tests -p 'test_gallery_storage.py' -v
      - name: Test license renewal, 1-day generation, prices and discounts
        run: python -m unittest cloud_control.tests.test_publish_auth -v
