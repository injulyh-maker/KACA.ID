<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Sandi - KACA.ID</title><style>:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263f6c,#071327 70%);color:#ecf4ff;display:grid;place-items:center;padding:20px}.card{max-width:860px;width:100%;background:#132543;border:1px solid #32527d;border-radius:20px;padding:30px}h1{margin:8px 0 15px}p{line-height:1.55;color:#bacde7}a{color:#9ccbff}button,.button{display:inline-block;background:#5279df;border:0;color:white;padding:13px 18px;border-radius:12px;font-weight:bold;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}input{background:#0c1d36;color:white;border:1px solid #3f5d86;padding:13px;border-radius:10px;width:100%;max-width:530px;font-size:16px}label{display:block;margin:15px 0 6px;font-weight:bold}.message{margin-top:18px;min-height:26px}small{color:#b6cbe8}</style></head><body><main class="card"><h1>Atur ulang kata sandi</h1><p>Masukkan kata sandi baru (minimal 10 karakter). Data booth, lisensi, dan sesi Anda tidak akan dihapus.</p><form id="form"><label>Kata sandi baru</label><input id="password" type="password" minlength="10" required autocomplete="new-password"><button type="submit" style="margin-top:15px">Ubah Sandi</button></form><p class="message" id="message"></p><a href="/">Kembali ke Login</a></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('button'),out=document.getElementById('message');btn.disabled=true;
 try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('password').value})});const d=await r.json();out.textContent=r.ok?d.message:(d.detail||'Reset gagal');if(r.ok)document.getElementById('password').value='';}
 catch(e){out.textContent='Jaringan tidak tersedia. Coba lagi.'}finally{btn.disabled=false}
};
</script></body></html>
